<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>خطة التحول 🏆</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:#07070f;color:#fff;font-family:-apple-system,Arial,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{border:none;background:none;cursor:pointer;font-family:inherit;touch-action:manipulation;color:inherit}
button:active{opacity:.8;transform:scale(.96);transition:all .08s}

#hdr{position:sticky;top:0;z-index:100;background:rgba(7,7,15,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid #1f2937;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.hdr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cdown{border-radius:16px;padding:8px 14px;text-align:center;background:linear-gradient(135deg,#f97316,#ef4444);box-shadow:0 4px 20px rgba(249,115,22,.4);min-width:58px}
.cdown-n{font-size:26px;font-weight:900;line-height:1;display:block}
.cdown-l{font-size:10px;color:rgba(255,220,190,.9);display:block;margin-top:2px}
.pb-wrap{height:3px;background:#1f2937;border-radius:4px;overflow:hidden}
.pb-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#f97316,#ef4444);transition:width 1s ease}
.pb-lbls{display:flex;justify-content:space-between;margin-top:4px}

#main{padding:16px;padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

.view-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.view-tab{border-radius:14px;padding:12px;font-size:14px;font-weight:700;border:2px solid #1f2937;background:#0f0f1a;color:#6b7280;text-align:center;transition:all .2s;width:100%}

.sec-lbl{font-size:11px;color:#4b5563;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}

.ph-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.ph-btn{border-radius:16px;padding:12px 6px;border:2px solid #1f2937;background:#0f0f1a;text-align:center;transition:all .2s;width:100%}
.ph-n{font-weight:900;font-size:18px;display:block;color:#4b5563}
.ph-wk{font-size:10px;display:block;margin-top:2px;color:#374151}
.ph-fc{font-size:11px;display:block;margin-top:3px;color:#4b5563}
.tip-box{border-radius:12px;padding:10px 14px;border:1px solid;font-size:12px}

.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;border-radius:16px;padding:10px 10px 8px;border:2px solid #1f2937;background:#0f0f1a;text-align:center;min-width:62px;transition:all .2s}
.day-e{font-size:18px;display:block}
.day-s{font-size:11px;font-weight:600;display:block;margin-top:3px;color:#6b7280}
.day-tag{font-size:10px;font-weight:700;display:block;margin-top:2px}

.d-hdr{background:#111827;border-radius:20px;border:1px solid #1f2937;padding:16px}
.d-title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.d-title-l{display:flex;align-items:center;gap:10px}
.d-emoji{font-size:30px}
.d-dur{background:#0f0f1a;border-radius:12px;padding:8px 12px;text-align:center;flex-shrink:0}
.d-dur-l{font-size:10px;color:#6b7280;display:block}
.d-dur-v{font-size:14px;font-weight:700;display:block}
.q-box{background:#0f0f1a;border-radius:12px;padding:10px 14px;margin-bottom:12px;border-right:3px solid}
.q-text{font-size:13px;font-style:italic}
.mode-row{display:flex;gap:8px;margin-bottom:8px}
.mode-btn{flex:1;padding:9px;border-radius:12px;font-size:12px;font-weight:700;border:2px solid #374151;background:transparent;color:#4b5563;transition:all .2s}
.sched-box{background:#0f0f1a;border-radius:12px;padding:8px 14px}
.sched-txt{font-size:11px;color:#e5e7eb;line-height:1.7;display:block}

.wo-sec{background:#111827;border-radius:20px;border:1px solid #1f2937;overflow:hidden}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #1f2937;background:#0d0d1a}
.sec-hdr-t{font-weight:700;font-size:13px}
.sec-pills{display:flex;gap:6px}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:#1f2937;color:#6b7280}
.sec-note{padding:8px 16px;border-bottom:1px solid #1f2937;background:#0f1626}
.sec-note-t{font-size:12px;color:#cbd5e1}
.ss-banner{padding:7px 16px;border-bottom:1px solid #1f2937;background:rgba(59,7,100,.18);text-align:center}
.ss-banner-t{font-size:12px;color:#c084fc;font-weight:600}

.ex-card{padding:16px;border-bottom:1px solid #1f2937}
.ex-card:last-child{border-bottom:none}
.ex-nr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.ex-ar{font-weight:800;font-size:14px}
.ex-en{font-size:11px;color:#6b7280;margin-top:3px}
.rep-b{border-radius:12px;padding:6px 10px;flex-shrink:0;text-align:center}
.rep-n{font-weight:900;font-size:14px}
.rep-l{font-size:11px;color:#9ca3af}
.w-box{border-radius:14px;padding:12px;margin-bottom:10px}
.w-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.w-left{flex:1;min-width:0}
.w-ph-lbl{font-size:11px;color:#9ca3af;margin-bottom:4px}
.w-num{font-weight:900;line-height:1;font-size:26px}
.w-cfg{font-size:11px;margin-top:6px;line-height:1.4}
.ph-pills{display:flex;gap:4px;flex-shrink:0}
.ph-pill{border-radius:10px;padding:6px;text-align:center;min-width:36px;background:#1f2937}
.ph-pill-n{font-size:10px;line-height:1;display:block;color:#6b7280}
.ph-pill-w{font-size:11px;font-weight:900;margin-top:3px;display:block;color:#9ca3af}
.ex-tip{border-radius:10px;padding:8px 12px;background:#1f2937}
.ex-tip-t{font-size:12px;color:#fde68a}
.ex-rest{font-size:11px;color:#374151;text-align:center;margin-top:6px}

.c-row{background:#111827;border-radius:16px;border:1px solid #1f2937;padding:14px}
.c-row-t{font-weight:700;font-size:14px;margin-bottom:10px}
.c-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.c-cell{background:#0f0f1a;border-radius:12px;padding:10px 8px;text-align:center}
.c-cell-l{font-size:10px;color:#6b7280;margin-bottom:4px;display:block}
.c-cell-v{font-weight:900;font-size:13px;display:block}

.rt-tip{background:#0f0f1a;border:1px solid #1f2937;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.rt-e{font-size:22px;flex-shrink:0}
.rt-t{font-size:13px;color:#e5e7eb}

.n-cyan{border-radius:12px;padding:10px 14px;border:1px solid #164e63;background:#0c2233;font-size:12px;color:#67e8f9}
.n-yel{border-radius:12px;padding:10px 14px;border:1px solid #78350f;background:#1c0a00;font-size:12px;color:#fde68a}
.n-blue{border-radius:14px;padding:12px 14px;border:1px solid #1d4ed8;background:linear-gradient(135deg,#1e3a5f,#0c1a2e);display:flex;align-items:center;gap:12px}
.n-pre{border-radius:14px;padding:12px 14px;border:1px solid #854d0e;background:#1c0a00;display:flex;align-items:center;gap:10px}

/* ── NUTRITION ── */
.macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px}
.macro-card{background:#0f0f1a;border-radius:14px;padding:12px;text-align:center;border:1px solid #1f2937}
.macro-card-full{grid-column:1/-1}
.macro-val{font-weight:900;font-size:24px;line-height:1}
.macro-unit{font-size:11px;color:#9ca3af;margin-top:2px;display:block}
.macro-lbl{font-size:11px;color:#6b7280;margin-top:4px;display:block}

.meal-card{background:#111827;border-radius:20px;border:1px solid #1f2937;overflow:hidden}
.meal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 0}
.meal-time{font-size:11px;color:#6b7280;background:#1f2937;padding:3px 8px;border-radius:8px;font-weight:600}
.meal-tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px}
.meal-title-row{display:flex;align-items:center;gap:8px;padding:8px 16px 4px}
.meal-emoji{font-size:22px}
.meal-name{font-weight:800;font-size:15px}
.meal-note{font-size:11px;color:#9ca3af;padding:0 16px 10px;border-bottom:1px solid #1f2937}
.meal-items{padding:10px 16px}
.meal-item{font-size:13px;color:#e5e7eb;padding:4px 0;line-height:1.5;display:block}
.meal-macros{display:flex;gap:6px;padding:10px 16px 14px;flex-wrap:wrap}
.m-chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:#1f2937;color:#9ca3af}

.avoid-item{background:#0f0f1a;border:1px solid #1f2937;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px}
.avoid-e{font-size:20px;flex-shrink:0}
.avoid-t{font-size:13px;color:#e5e7eb}

.ntip-item{background:#0f0f1a;border:1px solid #1f2937;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px}
.ntip-e{font-size:20px;flex-shrink:0}
.ntip-t{font-size:13px;color:#e5e7eb}

@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .22s ease forwards}
</style>
</head>

<div id="hdr">

    <div id="content"></div>

</div>

// ── STATE ──
let pi=0,di=0,mode='morning',view='workout';

// ── UTILS ──
const a=(col,x)=>col+x;
function daysLeft(){return Math.max(0,Math.ceil((new Date('2026-08-09')-Date.now())/86400000))}
function progress(){const d=daysLeft();return Math.min(98,Math.max(2,((79-d)/79)*100))}
function tStatus(){
  const n=Date.now(),ts=new Date('2026-05-28').getTime(),te=new Date('2026-06-10').getTime();
  if(n>=ts&&n<te)return'travel';
  if(n<ts)return'pre';
  return'ok';
}

// ── HEADER ──
function updateHdr(){
  document.getElementById('daysLeft').textContent=daysLeft();
  document.getElementById('pbFill').style.width=progress()+'%';
}

// ── VIEW TOGGLE ──
function setView(v){
  view=v;
  const wo=document.getElementById('wo-area');
  const nu=document.getElementById('nu-area');
  const tw=document.getElementById('tab-wo');
  const tn=document.getElementById('tab-nu');
  if(v==='workout'){
    wo.style.display='contents';nu.style.display='none';
    tw.style.cssText='background:#f9731622;border-color:#f97316;color:#f97316';
    tn.style.cssText='';
  } else {
    wo.style.display='none';nu.style.display='flex';
    tn.style.cssText='background:#22c55e22;border-color:#22c55e;color:#22c55e';
    tw.style.cssText='';
    renderNutrition();
  }
}

// ── PHASES ──
function renderPhases(){
  const ph=PHASES[pi];
  document.getElementById('phBtns').innerHTML=PHASES.map((p,i)=>`

      style="${i===pi?`border-color:${p.col};background:${a(p.col,'18')}`:''}">
      <span class="ph-n" style="color:${i===pi?p.col:'#4b5563'}">${p.n}</span>
      <span class="ph-wk" style="color:${i===pi?a(p.col,'bb'):'#374151'}">${p.wks}</span>
      <span class="ph-fc" style="color:${i===pi?'#e5e7eb':'#4b5563'}">${p.focus}</span>
    </button>`).join('');
  const t=document.getElementById('phTip');
  t.innerHTML=`<span style="color:${ph.col};font-weight:700">📌 </span><span style="color:#d1d5db">${ph.tip}</span>`;

}

// ── DAY TABS ──
function renderDayTabs(){
  document.getElementById('dayTabs').innerHTML=DAYS.map(d=>`
    <button class="day-btn" onclick="setDay(${d.id})"

}

// ── EXERCISE CARD ──
function exCard(ex,_pi){
  const ph=PHASES[_pi];
  const bw=ex.w[_pi]==='جسم',tm=ex.rp.includes('ث'),sm=ex.c[_pi].startsWith('↑');
  const pills=PHASES.map((p,wi)=>{
    const act=wi===_pi;
    const wv=ex.w[wi].replace('/يد','').replace(' kg','').replace('جسم','BW');
    return`<div class="ph-pill" style="${act?`background:${p.col}`:''}">
      <span class="ph-pill-n" style="color:${act?'#fff':'#6b7280'}">P${wi+1}</span>
      <span class="ph-pill-w" style="color:${act?'#fff':'#9ca3af'}">${wv}</span>
    </div>`;
  }).join('');
  const cfg=(!bw&&ex.c[_pi]!=='—')?`<div class="w-cfg" style="color:${sm?'#4ade80':'#9ca3af'}">${ex.c[_pi]}</div>`:'';
  return`<div class="ex-card">
    <div class="ex-nr">
      <div><div class="ex-ar">${ex.ar}</div><div class="ex-en">${ex.en} · ${ex.m}</div></div>
      <div class="rep-b" style="background:${a(ph.col,'22')};border:1px solid ${a(ph.col,'44')}">
        <span class="rep-n" style="color:${ph.col}">${ex.rp}</span>
        ${!bw&&!tm?'<span class="rep-l"> تكرار</span>':''}
      </div>
    </div>
    <div class="w-box" style="background:${a(ph.col,'12')};border:1px solid ${a(ph.col,'38')}">
      <div class="w-row">
        <div class="w-left">
          <div class="w-ph-lbl">الوزن — ${ph.full}</div>
          <div class="w-num" style="color:${ph.col}">${ex.w[_pi]}</div>${cfg}
        </div>
        <div class="ph-pills">${pills}</div>
      </div>
    </div>
    <div class="ex-tip"><div class="ex-tip-t">💡 ${ex.tip}</div></div>
    ${ex.rest?`<div class="ex-rest">⏱ راحة ${ex.rest}</div>`:''}
  </div>`;
}

// ── SECTION ──
function secHTML(sec,_pi){
  const sb=(sec.type==='superset'&&sec.exs.length>1)?
    `<div class="ss-banner"><span class="ss-banner-t">${sec.exs[0].ar} → مباشرة → ${sec.exs[1].ar} → راحة ${sec.rl}</span></div>`:'';
  const sn=sec.note?`<div class="sec-note"><span class="sec-note-t">${sec.note}</span></div>`:'';
  return`<div class="wo-sec">
    <div class="sec-hdr">
      <span class="sec-hdr-t" style="color:${sec.lc}">${sec.lbl}</span>
      <div class="sec-pills"><span class="pill">${sec.sl}</span><span class="pill">⏱ ${sec.rl}</span></div>
    </div>${sn}${sb}
    ${sec.exs.map(ex=>exCard(ex,_pi)).join('')}
  </div>`;
}

    h+=`<div class="n-blue"><span style="font-size:26px;flex-shrink:0">🇨🇳</span>

  const modeBlock=day.type!=='rest'?`
    <div class="mode-row">
      <button class="mode-btn" onclick="setMode('morning')" style="${mode==='morning'?'background:rgba(245,158,11,.15);border-color:#f59e0b;color:#fbbf24':''}">🌅 صباحي</button>
      <button class="mode-btn" onclick="setMode('evening')" style="${mode==='evening'?'background:rgba(79,70,229,.2);border-color:#6366f1;color:#a5b4fc':''}">🌙 مسائي</button>
    </div>
    <div class="sched-box"><span class="sched-txt">⏰ ${wo.sched[mode]}</span></div>`:'';
  h+=`<div class="d-hdr">
    <div class="d-title-row">
      <div class="d-title-l"><span class="d-emoji">${wo.emoji}</span>
        <div><div style="font-weight:900;font-size:20px;letter-spacing:-.5px">${wo.title}</div>

      </div>${durBox}
    </div>
    <div class="q-box" style="border-color:${wo.col}"><span class="q-text" style="color:${a(wo.col,'cc')}">"${wo.quote}"</span></div>
    ${modeBlock}</div>`;
  if(day.type==='rest'){
    h+=`<div style="display:flex;flex-direction:column;gap:8px">
      ${wo.tips.map(t=>`<div class="rt-tip"><span class="rt-e">${t.e}</span><span class="rt-t">${t.t}</span></div>`).join('')}</div>`;
  } else if(day.type==='cardio'){
    h+=`<div style="display:flex;flex-direction:column;gap:10px">
      ${wo.proto.map(r=>`<div class="c-row"><div class="c-row-t">${r.lbl}</div>
        <div class="c-grid">
          <div class="c-cell"><span class="c-cell-l">المدة</span><span class="c-cell-v" style="color:#fff">${r.mins[pi]}</span></div>
          <div class="c-cell"><span class="c-cell-l">السرعة</span><span class="c-cell-v" style="color:#06b6d4">${r.spds[pi]} <span style="font-size:10px;color:#6b7280">km/h</span></span></div>
          <div class="c-cell"><span class="c-cell-l">الشعور</span><span class="c-cell-v" style="color:#e5e7eb;font-size:12px">${r.note}</span></div>
        </div></div>`).join('')}
      <div class="n-cyan">💡 كل أسبوعين: ارفع السرعة 0.5 km/h — لازم جسمك يبقى مش متعود</div></div>`;
  } else {
    h+=`<div style="display:flex;flex-direction:column;gap:10px">
      ${wo.secs.map(s=>secHTML(s,pi)).join('')}
      <div class="n-cyan">🏃 <strong>اختياري:</strong> 10 دق تريدميل بعد التمرين (6.5 km/h) = حرق إضافي</div>
      <div class="n-yel">⚙️ <strong>الأقراص:</strong> الخضر ↑ = ما في تبديل — رتّب الأثقال قبل كل سيكشن</div></div>`;
  }
  const el=document.getElementById('content');
  el.innerHTML=h;el.classList.remove('fi');void el.offsetWidth;el.classList.add('fi');
}

// ── EVENTS ──
function setPhase(i){pi=i;renderPhases();renderContent()}
function setDay(i){di=i;renderDayTabs();renderContent();setTimeout(()=>document.getElementById('content').scrollIntoView({behavior:'smooth',block:'start'}),50)}
function setMode(m){mode=m;renderContent()}

// ── INIT ──
updateHdr();renderPhases();renderDayTabs();renderContent();
setView('workout');
setInterval(updateHdr,60000);
</script>
